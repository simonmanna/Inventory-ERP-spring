name: Release

# Pushing a tag v*.*.* publishes ghcr.io/<owner>/inventory-erp-api and -web (version + latest), attaches the SBOM and
# creates the GitHub release from docs/releases/<tag>.md. The release gate (docs/BUILD_GUIDE.md §7) is signed off
# BEFORE the tag is pushed.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests must be green on the tagged commit
        working-directory: backend
        run: ./gradlew build cyclonedxDirectBom --no-daemon
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/${owner}/inventory-erp-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/inventory-erp-web" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ${{ steps.names.outputs.api }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.api }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: |
            ${{ steps.names.outputs.web }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.web }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            backend/build/reports/cyclonedx/inventory-erp-sbom.json
            backend/build/reports/cyclonedx/inventory-erp-sbom.xml
