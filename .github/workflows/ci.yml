name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build, tests, quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Client tools for the backup round-trip test (must match the Testcontainers server major: 16).
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: PostgreSQL 16 client tools
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16
      - name: Formatting (Spotless)
        run: ./gradlew spotlessCheck --no-daemon
      - name: Build + tests (Testcontainers Postgres 16, Modulith, ArchUnit) + coverage gate
        run: ./gradlew build --no-daemon
      - name: SBOM (CycloneDX)
        run: ./gradlew cyclonedxDirectBom --no-daemon
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: backend/build/reports/cyclonedx/
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: backend/build/reports/jacoco/test/
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests
      # ACC-0 known accounting defects (docs/accounting/ACCOUNTING-TEST-STRATEGY.md). Test failures are expected and
      # non-blocking (ignoreFailures); compile/Docker errors or a run count that differs from the tags in the sources
      # fail this step (blocking). No tagged test at all = nothing known open, which is green.
      - name: Accounting known-defect verification (acc0VerificationTest)
        run: ./gradlew acc0VerificationTest --no-daemon
      - name: Accounting known-defect summary
        if: always()
        run: |
          dir=build/test-results/acc0VerificationTest
          tagged=$(grep -rho '@Tag("acc-known-defect")' src/test/java | wc -l)
          if [ "$tagged" -eq 0 ]; then
            echo "### Accounting known defects: none open" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if ! ls "$dir"/TEST-*.xml >/dev/null 2>&1; then
            echo "::error::acc0VerificationTest produced no JUnit XML (infrastructure failure)"; exit 1
          fi
          {
            echo "### Accounting known defects (expected failures until their ACC phase)"
            echo "| Class | Tests | Failures | Errors | Skipped |"
            echo "|---|---|---|---|---|"
            for f in "$dir"/TEST-*.xml; do
              head -c 2000 "$f" | grep -o '<testsuite [^>]*>' | head -1 | sed -E \
                's/.*name="([^"]*)".*tests="([0-9]+)".*skipped="([0-9]+)".*failures="([0-9]+)".*errors="([0-9]+)".*/| \1 | \2 | \4 | \5 | \3 |/'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload accounting known-defect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc0-verification-reports
          path: |
            backend/build/reports/tests/acc0VerificationTest
            backend/build/test-results/acc0VerificationTest

  license-server:
    name: Licence server build, tests, quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: license-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Formatting (Spotless)
        run: ./gradlew spotlessCheck --no-daemon
      # Includes the end-to-end walk-through on Testcontainers Postgres 16: sell, issue, activate,
      # check in, renew, suspend, resume, revoke, plus the authorization matrix.
      - name: Build + tests + coverage gate
        run: ./gradlew build --no-daemon
      - name: SBOM (CycloneDX)
        run: ./gradlew cyclonedxDirectBom --no-daemon
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-license-server
          path: license-server/build/reports/cyclonedx/
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: license-server-test-reports
          path: license-server/build/reports/tests

  security:
    name: Dependency scan (Trivy on the SBOM)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom
      - name: Scan backend SBOM — fail on HIGH/CRITICAL with a fix available
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: sbom
          scan-ref: sbom/inventory-erp-sbom.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
      - name: Scan web dependencies (pnpm lockfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: reference,backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  e2e:
    name: POS sell-loop e2e against Spring
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_e2e
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp_e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the API jar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon
      - name: Start the API (seeded DEMO org)
        working-directory: backend
        env:
          PORT: '3101'
          SPRING_PROFILES_ACTIVE: dev,seed
          JDBC_DATABASE_URL: jdbc:postgresql://localhost:5434/erp_e2e?stringtype=unspecified
        run: |
          nohup java -jar build/libs/inventory-erp.jar > api.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://localhost:3101/api/v1/health/ready && exit 0; sleep 2; done
          cat api.log; exit 1
      - name: Sell loop (twice — the suite must be re-runnable)
        env:
          POS_API_BASE: http://localhost:3101
        # pnpm, outside the workspace: the runner's npm crashes resolving vitest
        # ("Cannot read properties of null (reading 'edgesOut')"), in the repository and outside it.
        run: |
          cp -r contract-tests/e2e "$RUNNER_TEMP/e2e"
          cd "$RUNNER_TEMP/e2e"
          echo '{ "private": true }' > package.json
          pnpm add vitest@4.1.9
          pnpm exec vitest run --config vitest.config.mjs
          pnpm exec vitest run --config vitest.config.mjs
      - name: API log
        if: failure()
        run: cat backend/api.log

  contracts:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tools/contracts2java/generate.mjs
          node tools/prisma2jpa/generate.mjs
          node tools/extract-routes/extract.mjs
          git diff --exit-code -- backend/src docs/spec

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:i18n
      - run: pnpm web:build

  docker:
    name: Docker images (build + scan)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/Dockerfile.api -t inventory-erp-api:ci .
      - run: docker build -f infra/docker/Dockerfile.web -t inventory-erp-web:ci .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: inventory-erp-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: inventory-erp-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
