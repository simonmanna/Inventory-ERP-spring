# Optional monitoring stack. Run next to the main stack:
#   echo "$METRICS_TOKEN" > infra/monitoring/metrics_token
#   docker compose -f docker-compose.yml -f infra/monitoring/docker-compose.monitoring.yml up -d
# Grafana: http://localhost:3002 (admin / $GRAFANA_ADMIN_PASSWORD), dashboard "Inventory ERP — API".
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ierp-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infra/monitoring/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: ierp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"

volumes:
  prometheus-data:
  grafana-data:
