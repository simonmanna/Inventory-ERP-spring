# Prometheus scrape config for Inventory-ERP-spring.
# The API serves Prometheus text at /api/v1/metrics, gated by METRICS_TOKEN (required in the prod profile).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: inventory-erp-api
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:3000"]
        labels:
          service: inventory-erp-api
