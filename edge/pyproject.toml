[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lp-edge"
version = "0.1.0"
description = "Loss-prevention edge agent for Inventory-ERP: turns camera streams into ledger observations and keeps the video on site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    # Headless OpenCV bundles an LGPL FFmpeg build (RTSP intake, clip encoding); no system ffmpeg is installed.
    "opencv-python-headless>=4.10,<5",
    "onnxruntime>=1.18,<2",
    "cryptography>=41",
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lp-edge = "lp_edge.cli:main"
lp-edge-updater = "lp_edge.updater:main"
lp-edge-eval = "lp_edge.evaluation.cli:main"

[tool.setuptools.packages.find]
include = ["lp_edge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
