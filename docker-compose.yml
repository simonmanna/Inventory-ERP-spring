# Local / single-site stack: Postgres 16 + Spring API + nginx-served React web.
#   docker compose up -d db            # database only (for ./gradlew bootRun + pnpm web:dev)
#   docker compose up -d --build       # full stack on http://localhost:8080
#
# The licence authority is a separate product, not part of a customer's stack: it is in the
# `license` profile so it never starts by accident on a shop's machine.
#   docker compose --profile license up -d --build   # authority on http://localhost:3100
services:
  db:
    image: postgres:16-alpine
    container_name: ierp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp}
      POSTGRES_DB: ${DB_NAME:-erp}
    # pg_dump takes one lock per relation in a single transaction (298 tables + sequences).
    command: ["postgres", "-c", "max_locks_per_transaction=1024"]
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp} -d ${DB_NAME:-erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: ierp-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/${DB_NAME:-erp}?stringtype=unspecified
      DB_USER: ${DB_USER:-erp}
      DB_PASSWORD: ${DB_PASSWORD:-erp}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Behind the web container's nginx: without this every client shares nginx's address, so the anonymous rate
      # limits (10 logins in 5 minutes) would apply to the whole site at once.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      STORAGE_LOCAL_DIR: /app/var/uploads
      BACKUP_DIR: /app/backups
    volumes:
      - uploads:/app/var/uploads
      - backups:/app/backups
    ports:
      - "127.0.0.1:3001:3000"

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      # Build-time menu flags: mirror the API's ENABLE_* (unset = hidden). Rebuild the image after changing one.
      args:
        VITE_ENABLE_BEVERAGE: ${VITE_ENABLE_BEVERAGE:-}
        VITE_ENABLE_TASKS: ${VITE_ENABLE_TASKS:-}
        VITE_ENABLE_MANUFACTURING: ${VITE_ENABLE_MANUFACTURING:-}
        VITE_ENABLE_HR: ${VITE_ENABLE_HR:-}
        VITE_ENABLE_ORDERS: ${VITE_ENABLE_ORDERS:-}
        VITE_ENABLE_ALERTS: ${VITE_ENABLE_ALERTS:-}
    container_name: ierp-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

  # ---- the licence authority (profile: license) ----
  #
  # Runs on OUR infrastructure, never a customer's: it is the only place the signing private key
  # exists. Its own database, so a customer's backup or restore can never touch it.
  license-db:
    image: postgres:16-alpine
    container_name: ierp-license-db
    profiles: ["license"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LICENSE_DB_USER:-license}
      POSTGRES_PASSWORD: ${LICENSE_DB_PASSWORD:-license}
      POSTGRES_DB: ${LICENSE_DB_NAME:-license}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - licensedata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LICENSE_DB_USER:-license} -d ${LICENSE_DB_NAME:-license}"]
      interval: 5s
      timeout: 5s
      retries: 10

  license-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.license
    container_name: ierp-license-api
    profiles: ["license"]
    restart: unless-stopped
    depends_on:
      license-db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3100
      JDBC_DATABASE_URL: jdbc:postgresql://license-db:5432/${LICENSE_DB_NAME:-license}
      DB_USER: ${LICENSE_DB_USER:-license}
      DB_PASSWORD: ${LICENSE_DB_PASSWORD:-license}
      SPRING_PROFILES_ACTIVE: ${LICENSE_PROFILES_ACTIVE:-prod}
      # Both are mandatory under the prod profile: StartupChecks refuses to start without them and
      # says which is missing. Not declared with compose's `:?` syntax, because that is evaluated
      # for the whole file and would break `docker compose up db` for every ordinary deployment.
      LICENSE_SIGNING_PASSPHRASE: ${LICENSE_SIGNING_PASSPHRASE:-}
      LICENSE_ADMIN_JWT_SECRET: ${LICENSE_ADMIN_JWT_SECRET:-}
      # Used once, to create the first owner. Remove from .env afterwards.
      LICENSE_ADMIN_EMAIL: ${LICENSE_ADMIN_EMAIL:-}
      LICENSE_ADMIN_PASSWORD: ${LICENSE_ADMIN_PASSWORD:-}
      LICENSE_REMINDER_FROM: ${LICENSE_REMINDER_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "127.0.0.1:3100:3100"

volumes:
  pgdata:
  uploads:
  backups:
  licensedata:
