# Local / single-site stack: Postgres 16 + Spring API + nginx-served React web.
#   docker compose up -d db            # database only (for ./gradlew bootRun + pnpm web:dev)
#   docker compose up -d --build       # full stack on http://localhost:8080
#
# The licence authority is a separate product, not part of a customer's stack: it is in the
# `license` profile so it never starts by accident on a shop's machine.
#   docker compose --profile license up -d --build   # authority on http://localhost:3100
#
# A branch relay node (ADR-S083 O7) is in the `branch` profile: its own Postgres and an API in erp.sync.mode=branch
# that relays its tills to HQ (by default the `api` service of this file; set BRANCH_HQ_URL for a remote HQ).
#   docker compose --profile branch up -d --build    # HQ + branch; branch API :3003, branch web app :8081
services:
  db:
    image: postgres:16-alpine
    container_name: ierp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp}
      POSTGRES_DB: ${DB_NAME:-erp}
    # pg_dump takes one lock per relation in a single transaction (298 tables + sequences).
    command: ["postgres", "-c", "max_locks_per_transaction=1024"]
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp} -d ${DB_NAME:-erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: ierp-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/${DB_NAME:-erp}?stringtype=unspecified
      # Row-level security (docs/DATABASE.md section 6): migrations and backups run as the database owner, the API as
      # its own role, which Flyway creates on first start (also on an existing volume) and which owns nothing.
      FLYWAY_USER: ${DB_USER:-erp}
      FLYWAY_PASSWORD: ${DB_PASSWORD:-erp}
      DB_USER: ${DB_APP_USER:-erp_app}
      DB_PASSWORD: ${DB_APP_PASSWORD:-erp_app}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Behind the web container's nginx: without this every client shares nginx's address, so the anonymous rate
      # limits (10 logins in 5 minutes) would apply to the whole site at once.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # Rate limits on (default). Only load measurements (tools/perf) switch them off.
      THROTTLE_ENABLED: ${THROTTLE_ENABLED:-true}
      STORAGE_LOCAL_DIR: /app/var/uploads
      BACKUP_DIR: /app/backups
      # Embedded Superset (on by default): dashboard ids and the embed service account come from the bi volume.
      # SUPERSET_URL set but empty in .env turns it off.
      SUPERSET_URL: ${SUPERSET_URL-http://superset:8088}
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-http://localhost:8088}
      SUPERSET_DASHBOARDS_FILE: /bi/dashboards.json
      SUPERSET_SECRETS_FILE: /bi/secrets.env
    volumes:
      - uploads:/app/var/uploads
      - backups:/app/backups
      - bi:/bi:ro
    ports:
      - "127.0.0.1:3001:3000"

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      # Build-time menu flags: mirror the API's ENABLE_* (unset = hidden). Rebuild the image after changing one.
      args:
        VITE_ENABLE_BEVERAGE: ${VITE_ENABLE_BEVERAGE:-}
        VITE_ENABLE_TASKS: ${VITE_ENABLE_TASKS:-}
        VITE_ENABLE_MANUFACTURING: ${VITE_ENABLE_MANUFACTURING:-}
        VITE_ENABLE_HR: ${VITE_ENABLE_HR:-}
        VITE_ENABLE_ORDERS: ${VITE_ENABLE_ORDERS:-}
        VITE_ENABLE_ALERTS: ${VITE_ENABLE_ALERTS:-}
        VITE_ENABLE_LOSS_PREVENTION: ${VITE_ENABLE_LOSS_PREVENTION:-}
    container_name: ierp-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

  # ---- embedded Apache Superset dashboards (on by default, ADR-S078, docs/integrations.md) ----
  #
  # `docker compose up -d --build` starts Superset with the rest: bi-secrets generates any secret .env leaves empty,
  # superset-provision builds the dashboards and writes their ids for the API, and every analytics screen opens on its
  # interactive dashboard. Superset on http://localhost:8088 (admin password: SUPERSET_ADMIN_PASSWORD in .env, else
  # `docker compose exec superset cat /bi/secrets.env`). It needs about 1.5 GB of RAM; to run without it:
  #   docker compose up -d db api web        and set SUPERSET_URL= (empty) in .env
  bi-secrets:
    image: alpine:3.20
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-}
      SUPERSET_GUEST_TOKEN_SECRET: ${SUPERSET_GUEST_TOKEN_SECRET:-}
      SUPERSET_META_DB_PASSWORD: ${SUPERSET_META_DB_PASSWORD:-}
      SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD:-}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-}
      SUPERSET_EMBED_USERNAME: ${SUPERSET_EMBED_USERNAME:-}
      SUPERSET_EMBED_PASSWORD: ${SUPERSET_EMBED_PASSWORD:-}
    volumes:
      - bi:/bi
      - ./infra/docker/superset/gen-secrets.sh:/gen-secrets.sh:ro
    entrypoint: ["sh", "/gen-secrets.sh"]
    restart: "no"

  superset-db-init:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
      bi-secrets:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      POSTGRES_USER: ${DB_USER:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp}
      POSTGRES_DB: ${DB_NAME:-erp}
      SUPERSET_META_DB_PASSWORD: ${SUPERSET_META_DB_PASSWORD:-}
      SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD:-}
    volumes:
      - bi:/bi:ro
      - ./infra/docker/superset/init-db.sh:/init-db.sh:ro
    entrypoint: ["sh", "/init-db.sh"]
    restart: "no"

  superset-redis:
    image: redis:7-alpine
    container_name: ierp-superset-redis
    restart: unless-stopped

  superset:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.superset
    container_name: ierp-superset
    restart: unless-stopped
    depends_on:
      superset-db-init:
        condition: service_completed_successfully
      superset-redis:
        condition: service_started
    environment:
      # Secrets come from /bi/secrets.env (bi-secrets: .env values, else generated); bootstrap.sh builds the
      # metadata database URI from them.
      SUPERSET_DB_HOST: db
      SUPERSET_REDIS_URL: redis://superset-redis:6379/0
      SUPERSET_FRAME_ANCESTORS: ${SUPERSET_FRAME_ANCESTORS:-http://localhost:8080 http://localhost:5173}
      SUPERSET_COOKIE_SECURE: ${SUPERSET_COOKIE_SECURE:-false}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
    volumes:
      - bi:/bi:ro
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Dashboards as code: creates or updates every dashboard in tools/superset-provision/dashboards on each `up`, then
  # writes their ids to /bi/dashboards.json, which the API picks up without a restart.
  superset-provision:
    image: node:22-alpine
    depends_on:
      superset:
        condition: service_healthy
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_FRAME_ANCESTORS: ${SUPERSET_FRAME_ANCESTORS:-http://localhost:8080 http://localhost:5173}
      BI_DB_NAME: ${DB_NAME:-erp}
    volumes:
      - bi:/bi
      - ./tools/superset-provision:/provision:ro
      - ./infra/docker/superset/provision.sh:/provision.sh:ro
    entrypoint: ["sh", "/provision.sh"]
    restart: "no"

  # ---- the licence authority (profile: license) ----
  #
  # Runs on OUR infrastructure, never a customer's: it is the only place the signing private key
  # exists. Its own database, so a customer's backup or restore can never touch it.
  license-db:
    image: postgres:16-alpine
    container_name: ierp-license-db
    profiles: ["license"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LICENSE_DB_USER:-license}
      POSTGRES_PASSWORD: ${LICENSE_DB_PASSWORD:-license}
      POSTGRES_DB: ${LICENSE_DB_NAME:-license}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - licensedata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LICENSE_DB_USER:-license} -d ${LICENSE_DB_NAME:-license}"]
      interval: 5s
      timeout: 5s
      retries: 10

  license-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.license
    container_name: ierp-license-api
    profiles: ["license"]
    restart: unless-stopped
    depends_on:
      license-db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3100
      JDBC_DATABASE_URL: jdbc:postgresql://license-db:5432/${LICENSE_DB_NAME:-license}
      DB_USER: ${LICENSE_DB_USER:-license}
      DB_PASSWORD: ${LICENSE_DB_PASSWORD:-license}
      SPRING_PROFILES_ACTIVE: ${LICENSE_PROFILES_ACTIVE:-prod}
      # Both are mandatory under the prod profile: StartupChecks refuses to start without them and
      # says which is missing. Not declared with compose's `:?` syntax, because that is evaluated
      # for the whole file and would break `docker compose up db` for every ordinary deployment.
      LICENSE_SIGNING_PASSPHRASE: ${LICENSE_SIGNING_PASSPHRASE:-}
      LICENSE_ADMIN_JWT_SECRET: ${LICENSE_ADMIN_JWT_SECRET:-}
      # Used once, to create the first owner. Remove from .env afterwards.
      LICENSE_ADMIN_EMAIL: ${LICENSE_ADMIN_EMAIL:-}
      LICENSE_ADMIN_PASSWORD: ${LICENSE_ADMIN_PASSWORD:-}
      LICENSE_REMINDER_FROM: ${LICENSE_REMINDER_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "127.0.0.1:3100:3100"

  # ---- branch relay node (ADR-S083 O7, docs/OPERATIONS.md §1a) ----
  #
  # branch-enroll registers the branch at HQ once (BRANCH_HQ_ADMIN_EMAIL / _PASSWORD, BRANCH_CODE = an HQ branch
  # code) and keeps the branch token in the branchenroll volume; branch-api starts with it. Tills of that branch point
  # at http://<this machine>:3003. On a branch machine with a remote HQ start only the branch services:
  #   BRANCH_HQ_URL=https://hq.example.com/api/v1 BRANCH_HQ_ORIGIN=https://hq.example.com docker compose --profile branch up -d branch-db branch-enroll branch-api branch-web
  # Drill (cut the link, restore the branch, compare HQ): infra/docker/branch/drill.sh
  branch-db:
    image: postgres:16-alpine
    container_name: ierp-branch-db
    profiles: ["branch"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BRANCH_DB_USER:-erp}
      POSTGRES_PASSWORD: ${BRANCH_DB_PASSWORD:-erp}
      POSTGRES_DB: ${BRANCH_DB_NAME:-erp_branch}
    command: ["postgres", "-c", "max_locks_per_transaction=1024"]
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - branchdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BRANCH_DB_USER:-erp} -d ${BRANCH_DB_NAME:-erp_branch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  branch-enroll:
    image: alpine:3.20
    profiles: ["branch"]
    environment:
      HQ_URL: ${BRANCH_HQ_URL:-http://api:3000/api/v1}
      HQ_ORG_CODE: ${BRANCH_HQ_ORG:-DEMO}
      HQ_ADMIN_EMAIL: ${BRANCH_HQ_ADMIN_EMAIL:-}
      HQ_ADMIN_PASSWORD: ${BRANCH_HQ_ADMIN_PASSWORD:-}
      BRANCH_CODE: ${BRANCH_CODE:-}
      BRANCH_NAME: ${BRANCH_NAME:-}
    volumes:
      - branchenroll:/enroll
      - ./infra/docker/branch/enroll.sh:/enroll.sh:ro
    entrypoint: ["sh", "/enroll.sh"]
    restart: "no"

  branch-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: ierp-branch-api
    profiles: ["branch"]
    restart: unless-stopped
    depends_on:
      branch-db:
        condition: service_healthy
      branch-enroll:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      JDBC_DATABASE_URL: jdbc:postgresql://branch-db:5432/${BRANCH_DB_NAME:-erp_branch}?stringtype=unspecified
      FLYWAY_USER: ${BRANCH_DB_USER:-erp}
      FLYWAY_PASSWORD: ${BRANCH_DB_PASSWORD:-erp}
      DB_USER: ${BRANCH_DB_APP_USER:-erp_app}
      DB_PASSWORD: ${BRANCH_DB_APP_PASSWORD:-erp_app}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      ERP_SYNC_MODE: branch
      ERP_SYNC_SERVER_ID: ${BRANCH_SERVER_ID:-branch-1}
      ERP_SYNC_BRANCH_HQ_URL: ${BRANCH_HQ_URL:-http://api:3000/api/v1}
      # A branch node runs no business jobs: HQ is the system of record. Its relay loop runs regardless.
      APP_JOBS_ENABLED: "false"
      SUPERSET_URL: ""
      STORAGE_LOCAL_DIR: /app/var/uploads
    volumes:
      - branchenroll:/enroll:ro
    # The token and organisation id come from the enrolment, not from .env.
    entrypoint: ["/bin/sh", "-c", ". /enroll/branch.env && exec /sbin/tini -- java org.springframework.boot.loader.launch.JarLauncher"]
    ports:
      - "${BRANCH_PORT:-3003}:3000"

  # Browser tills at the branch: the web app served locally; sync goes to branch-api, sign-in and back office to HQ.
  # A browser registered at HQ for this branch (Settings → Offline Devices → This browser, with the branch chosen)
  # keeps selling through the branch while HQ is down. BRANCH_HQ_ORIGIN = HQ's origin without /api/v1.
  branch-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: ierp-branch-web
    profiles: ["branch"]
    restart: unless-stopped
    depends_on:
      - branch-api
    environment:
      BRANCH_API_ORIGIN: http://branch-api:3000
      BRANCH_HQ_ORIGIN: ${BRANCH_HQ_ORIGIN:-http://api:3000}
    volumes:
      - ./infra/docker/branch/nginx.branch.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${BRANCH_WEB_PORT:-8081}:80"

volumes:
  pgdata:
  bi:
  uploads:
  backups:
  licensedata:
  branchdata:
  branchenroll:
