# Test overrides (loaded in addition to the main application.yml).
# Throttling and cron jobs off so integration tests are deterministic; dedicated tests re-enable them.
app.throttle.enabled=false
app.jobs.enabled=false
app.modules.tasks=true
app.modules.orders=true
app.modules.hr=true
app.modules.beverage=true
app.modules.assets=true
app.modules.manufacturing=true
