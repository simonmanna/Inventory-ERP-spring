# Env var names intentionally match the POS-CAFE .env.example so one .env drives either backend.
server:
  port: ${PORT:3001}
  address: ${HOST:0.0.0.0}
  max-http-request-header-size: 64KB
  compression:
    enabled: true
  shutdown: graceful
  tomcat:
    max-swallow-size: 2MB

spring:
  application:
    name: inventory-erp
  threads:
    virtual:
      enabled: true
  datasource:
    # stringtype=unspecified lets string-bound enum values cast to Postgres enum columns.
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5434/erp?stringtype=unspecified}
    username: ${DB_USER:erp}
    password: ${DB_PASSWORD:erp}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Lets the app take over an existing POS-CAFE database: V1 (schema) + V2 (reference rows)
    # are already present there, so it starts at V3.
    baseline-on-migrate: true
    baseline-version: 2
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_BYTES:25MB}
      max-request-size: ${UPLOAD_MAX_BYTES:25MB}
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

management:
  endpoints:
    web:
      # /api/v1/metrics is served by kernel MetricsController (METRICS_TOKEN gate, Nest parity), which
      # renders the Prometheus registry; no actuator web endpoints are exposed.
      exposure:
        include: ""
  endpoint:
    health:
      probes:
        enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /api/docs

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:dev-only-access-secret-change-me-32bytes!!}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-only-refresh-secret-change-me-32bytes!}
    pos-secret: ${JWT_POS_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
    pos-ttl: ${JWT_POS_TTL:12h}
  cors:
    origins: ${CORS_ORIGINS:}
    allow-lan: ${CORS_ALLOW_LAN:}
  license:
    # Base URL of the central licence authority. Empty means this install can only be licensed by an
    # offline .lic file, which is the intended setup for an air-gapped shop.
    server-url: ${LICENSE_SERVER_URL:}
    # How long an install with no licence may run before it becomes read-only.
    trial-days: ${LICENSE_TRIAL_DAYS:14}
    # Master switch. false keeps the licence visible and warns, but never refuses a write - for
    # development, and for a support session where billing must not be what blocks the diagnosis.
    enforce: ${LICENSE_ENFORCE:true}
    heartbeat: ${LICENSE_HEARTBEAT:true}
    http-timeout: ${LICENSE_HTTP_TIMEOUT:10s}
    # What this install calls itself in the authority's list of activations (default: hostname).
    instance-name: ${LICENSE_INSTANCE_NAME:}
  errors:
    expose-detail: ${EXPOSE_ERROR_DETAIL:false}
  read-only: ${READ_ONLY_MODE:false}
  # Business "local" zone for receipts, report days and date filters (Nest: host TZ). JVM/JDBC stay UTC.
  timezone: ${APP_TIMEZONE:UTC}
  throttle:
    enabled: ${THROTTLE_ENABLED:true}
  storage:
    driver: ${STORAGE_DRIVER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./var/uploads}
  modules:
    beverage: ${ENABLE_BEVERAGE:false}
    assets: ${ENABLE_ASSETS:false}
    tasks: ${ENABLE_TASKS:false}
    manufacturing: ${ENABLE_MANUFACTURING:false}
    rental: ${ENABLE_RENTAL:false}
    repair: ${ENABLE_REPAIR:false}
    hr: ${ENABLE_HR:false}
    orders: ${ENABLE_ORDERS:false}
    communication: ${ENABLE_COMMUNICATION:false}
    fleet: ${ENABLE_FLEET:false}
  # Fleet 1.6: daily preventive-maintenance run (raises work orders for due service schedules; ShedLock).
  fleet:
    maintenance-due-cron: ${FLEET_MAINTENANCE_DUE_CRON:0 30 5 * * *}
    # Fleet 1.9: daily expiry / service-due reminders (deduplicated per item per day; ShedLock).
    reminders-cron: ${FLEET_REMINDERS_CRON:0 0 6 * * *}
    # Fleet 1.4 weighbridge: upper bound of any indicator read (each device has its own readTimeoutMs).
    weighbridge:
      max-read-timeout-ms: ${FLEET_WEIGHBRIDGE_MAX_READ_TIMEOUT_MS:15000}
  # Quality management (ADR-S013): REST laboratory adapter (LabResultAdapter "rest"); blank URL = not configured.
  quality:
    lab:
      rest:
        base-url: ${QUALITY_LAB_REST_URL:}
        token: ${QUALITY_LAB_REST_TOKEN:}
        timeout-ms: ${QUALITY_LAB_REST_TIMEOUT_MS:10000}
  manufacturing:
    # Shop-floor machine data (ADR-S015): REST pull adapter (GET <url>/events?machine=&since=&until=, bearer token).
    machine-data:
      rest:
        base-url: ${MFG_MACHINE_DATA_REST_URL:}
        token: ${MFG_MACHINE_DATA_REST_TOKEN:}
        timeout-ms: ${MFG_MACHINE_DATA_REST_TIMEOUT_MS:10000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
