# Quality-gate ratchets (P8). Never lower. Every application package at 0.80 since PR-1 part 2.
coverage.application.min=0.80

# Build speed: warm daemon, parallel tasks, build cache, configuration cache.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# pitest / cyclonedx are not fully configuration-cache clean: warn instead of failing the build.
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
