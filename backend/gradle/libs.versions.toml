[versions]
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
spring-modulith = "2.1.1"
springdoc = "3.1.0"
shedlock = "7.10.1"
bucket4j = "8.21.0"
mapstruct = "1.6.3"
totp = "1.7.1"
logstash = "9.0"
openpdf = "3.0.5"
zxing = "3.5.4"
commons-csv = "1.14.1"
poi = "5.4.1"
web-push = "5.1.2"
bouncycastle = "1.86"
archunit = "1.5.1"
rest-assured = "6.2.0"
instancio = "6.1.0"
cyclonedx = "3.5.1"
spotless = "8.10.4"
pitest-plugin = "1.19.0"
pitest = "1.30.1"
pitest-junit5 = "1.2.3"

[libraries]
springdoc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
shedlock-jdbc = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }
bucket4j = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
totp = { module = "dev.samstevens.totp:totp", version.ref = "totp" }
logstash = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash" }
openpdf = { module = "com.github.librepdf:openpdf", version.ref = "openpdf" }
zxing = { module = "com.google.zxing:core", version.ref = "zxing" }
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commons-csv" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
web-push = { module = "nl.martijndwars:web-push", version.ref = "web-push" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }
instancio = { module = "org.instancio:instancio-junit", version.ref = "instancio" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }
